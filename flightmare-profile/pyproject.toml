[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightmare-profile"
version = "0.2.0"
requires-python = ">=3.10"
description = "Local systems profiling for the Flightmare CUDA rewrite"
dependencies = []

[project.scripts]
flightmare-profile = "flightmare_profile.__main__:main"

[tool.setuptools.packages.find]
include = ["flightmare_profile*"]
