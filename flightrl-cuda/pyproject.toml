[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrl-cuda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<3", "PyYAML==6.0.3", "numpy"]
description = "Resident headless Flightmare task and PPO usage layer"

[project.optional-dependencies]
spaces = ["gymnasium==1.2.2"]

[project.scripts]
flightrl-train = "flightrl_cuda.train:main"

[tool.setuptools.package-data]
flightrl_cuda = ["defaults.yaml"]

[tool.setuptools]
packages = ["flightrl_cuda"]
