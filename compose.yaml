name: flightmare-cuda

services:
  dev:
    build:
      context: docker
      dockerfile: Dockerfile.dev
    image: flightmare-cuda-dev:13.3.1
    gpus: all
    init: true
    command: ["sleep", "infinity"]
    working_dir: /workspace
    environment:
      FLIGHTMARE_PATH: /workspace
      PYTHONPATH: /build/flightlib
      CCACHE_DIR: /build/ccache
      FLIGHTMARE_CUDA_ARCHITECTURES: "${FLIGHTMARE_CUDA_ARCHITECTURES:-120-real}"
    volumes:
      - .:/workspace
      - build:/build

  ros2:
    profiles: ["ros2"]
    image: ros:jazzy-ros-base
    gpus: all
    init: true
    working_dir: /workspace
    environment:
      PYTHONPATH: /build/flightlib-cuda-python-native/python:/build/newton-renderer:/build/flightmare-mavlink
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    volumes:
      - .:/workspace
      - build:/build
    command: ["/build/flightlib-cuda-python/bin/python", "-m", "flightlib_cuda.ros2"]

volumes:
  build:
