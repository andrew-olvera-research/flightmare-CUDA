services:
  isaac:
    image: nvcr.io/nvidia/isaac-sim:6.2.0
    profiles: [isaac]
    gpus: all
    init: true
    working_dir: /isaac-sim
    entrypoint: ["/bin/bash", "-ec"]
    command: ['test "$$ACCEPT_EULA" = Y || { echo "Set ACCEPT_EULA=Y after accepting the NVIDIA Omniverse license"; exit 2; }; mkdir -p "$$XDG_CACHE_HOME" "$$CUDA_CACHE_PATH"; exec sleep infinity']
    healthcheck:
      disable: true
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:-}"
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
      XDG_CACHE_HOME: /isaac-sim/data/cache
      CUDA_CACHE_PATH: /isaac-sim/data/ComputeCache
    volumes:
      - .:/workspace:ro
      - build:/build:ro
      - isaac-data:/isaac-sim/data
volumes:
  isaac-data:
