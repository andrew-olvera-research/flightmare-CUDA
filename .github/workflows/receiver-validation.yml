name: Receiver validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  capture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p test_heartbeat.py
      - run: python3 -m unittest discover -s scripts/tests -p test_deadline_scores.py
      - run: python3 -m unittest discover -s scripts/tests -p test_bristol_contract.py
